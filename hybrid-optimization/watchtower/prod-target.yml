# Paste under `targets:` in Watchtower's databricks.yml (your fork).
# Retention is OFF so raw cluster logs are never deleted.
# Keep "OFF" quoted: unquoted OFF is parsed by YAML as boolean false.
prod:
  mode: production
  workspace:
    host: https://<prod-workspace>.cloud.databricks.com
    root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  run_as:
    service_principal_name: <sp-application-id>
  variables:
    catalog: watchtower
    schema: default
    cluster_logs_volume: /Volumes/watchtower/default/cluster_logs/cluster-logs
    warehouse_id: <prod-sql-warehouse-id>
    job_run_compute_lookback_interval: INTERVAL 30 DAYS
    raw_log_retention_action: "OFF"
    raw_log_retention_duration: 30 days
    raw_log_retention_move_destination: ""
